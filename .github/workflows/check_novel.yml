name: 小說上架檢查

on:
  push:
    branches: [main]
    paths:
      - 'works/**'
      - 'data/**'
      - 'tools/check_novel.py'
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'sw.js'
      - '.github/workflows/check_novel.yml'
  pull_request:
    paths:
      - 'works/**'
      - 'data/**'
      - 'tools/check_novel.py'
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'sw.js'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 檢查器自我測試
        run: python tools/check_novel.py --self-test
      - name: 上架前檢查
        run: python tools/check_novel.py
