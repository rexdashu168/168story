<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120c0b">
<title>等待輪迴Ⅱ－連城</title>
<style>
:root{
  --bg:#120c0b; --bg2:#1d1513; --card:#261c19; --line:#3a2c27;
  --text:#f3e9df; --sub:#b9a89b; --dim:#76665c;
  --gold:#e0b56a; --red:#b3262e; --pink:#f2a7b6;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg)}
.hidden{display:none!important}

/* 首頁：海報輪播 */
.hero{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.hero img.on{opacity:1}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,var(--bg))}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:2}
.dots i{width:6px;height:6px;border-radius:3px;background:#fff6;transition:width .3s}
.dots i.on{width:18px;background:var(--gold)}

.info{display:flex;gap:14px;padding:0 16px;margin-top:-34px;position:relative;z-index:3}
.info .cover{width:96px;flex:none;aspect-ratio:3/4;border-radius:10px;object-fit:cover;box-shadow:0 6px 20px #000a;border:1px solid #fff2}
.info h1{font-family:var(--serif);font-size:24px;margin:38px 0 2px;letter-spacing:2px;color:var(--gold)}
.info .st{font-family:var(--serif);font-size:16px;color:var(--text);letter-spacing:6px}
.info .meta{font-size:13px;color:var(--sub);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.tags span{font-size:12px;color:var(--pink);border:1px solid #f2a7b655;border-radius:20px;padding:2px 10px}
.acts{display:flex;gap:10px;padding:14px 16px}
.btn{flex:1;height:44px;border-radius:22px;background:linear-gradient(90deg,#c9342f,#e0b56a);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{flex:none;width:96px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px}
.btn.ghost.on{color:var(--gold);border-color:var(--gold)}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:26px;padding:10px 16px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{font-size:17px;color:var(--dim);padding:6px 0 10px;position:relative}
.tabs button.on{color:var(--text);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:2px;background:var(--gold)}

.pane{padding:16px}
.intro p{font-family:var(--serif);font-size:16px;line-height:1.9;color:var(--text);margin:0 0 14px}
.poem{font-family:var(--serif);color:var(--gold);line-height:2;letter-spacing:2px;border-left:2px solid var(--red);padding-left:14px;margin:18px 0}
.sec{font-size:13px;color:var(--sub);margin:22px 0 8px;letter-spacing:1px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scenes button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.scenes b{display:block;font-family:var(--serif);font-size:15px}
.scenes small{color:var(--dim);font-size:12px}

/* 選集 */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ranges{display:flex;gap:18px;overflow-x:auto}
.ranges button{font-size:15px;color:var(--dim);white-space:nowrap;padding:4px 0}
.ranges button.on{color:var(--text);font-weight:700}
.mode{display:flex;background:var(--card);border-radius:16px;padding:2px;flex:none}
.mode button{font-size:13px;padding:4px 12px;border-radius:14px;color:var(--sub)}
.mode button.on{background:var(--line);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{position:relative;aspect-ratio:1/1;border-radius:10px;background:var(--card);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.wip{color:var(--dim)}
.cell.wip::after{content:"";position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.cell.cur{background:#5a3a2a;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.legend{font-size:12px;color:var(--dim);margin-top:12px;display:flex;gap:14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.toc .sc{margin-bottom:18px}
.toc .sch{font-family:var(--serif);font-size:15px;color:var(--gold);margin-bottom:6px}
.toc button{display:flex;width:100%;gap:12px;align-items:baseline;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.toc button span{color:var(--dim);font-size:13px;width:44px;flex:none;font-variant-numeric:tabular-nums}
.toc button b{font-weight:500;font-size:15px;flex:1}
.toc button em{font-style:normal;font-size:12px;color:var(--dim)}
.toc button.cur b{color:var(--gold)}

/* 閱讀頁 */
.reader{--rbg:#17110f;--rtx:#e9ddd1;--rsub:#9c8b7e;--fs:19px;background:var(--rbg);color:var(--rtx);min-height:100vh}
.reader.paper{--rbg:#f4ead8;--rtx:#3a2c22;--rsub:#8a7461}
.reader.white{--rbg:#ffffff;--rtx:#222;--rsub:#888}
.rtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:50px;padding:0 8px;background:var(--rbg);border-bottom:1px solid #8884}
.rtop .t{flex:1;text-align:center;font-size:15px;color:var(--rsub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;border-radius:20px;font-size:20px;color:var(--rtx)}
.rhead{padding:34px 22px 10px;text-align:center}
.rhead .sc{font-size:13px;color:var(--rsub);letter-spacing:2px}
.rhead h2{font-family:var(--serif);font-size:26px;margin:10px 0 0;letter-spacing:2px;line-height:1.4}
.rhead .orn{color:var(--red);margin-top:12px;letter-spacing:8px}
.body{padding:10px 22px 30px;font-family:var(--serif);font-size:var(--fs);line-height:2;letter-spacing:.5px}
.body p{margin:0 0 1em;text-indent:2em}
.body img{display:block;width:100%;border-radius:8px;margin:18px 0}
.body .brk{text-align:center;color:var(--rsub);letter-spacing:10px;margin:1.4em 0}
.empty{text-align:center;color:var(--rsub);padding:40px 22px 60px;font-size:15px;line-height:1.9}
.empty .pen{font-size:34px;margin-bottom:8px}
.rnav{display:flex;gap:10px;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.rnav button{flex:1;height:44px;border-radius:22px;border:1px solid #8886;font-size:15px}
.rnav button:disabled{opacity:.35}

/* 底部抽屜 */
.mask{position:fixed;inset:0;background:#0009;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;max-height:78vh;overflow:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));color:var(--text)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:16px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.seg{display:flex;gap:8px}
.seg button{min-width:44px;height:34px;padding:0 12px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:14px}
.seg button.on{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var IMG=window.__IMG||{cover:'img/cover.jpg',hero:['img/hero1.jpg','img/hero2.jpg','img/hero3.jpg']};
var D=null, app=document.getElementById('app');
var store={get:function(k,d){try{var v=localStorage.getItem('dl2_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
           set:function(k,v){try{localStorage.setItem('dl2_'+k,JSON.stringify(v))}catch(e){}}};
var ui={tab:'intro',range:0,mode:store.get('mode','grid')};
var RANGES=[[1,30],[31,60],[61,90],[91,108]];
var timer=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function zh(n){var d='零一二三四五六七八九';if(n<=10)return n===10?'十':d[n];if(n<20)return'十'+d[n%10];return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'')}
function ep(n){return D.episodes[n-1]}
function scene(n){return D.scenes[n-1]}
function ready(e){return e.status==='ready'}
function readyCount(){return D.episodes.filter(ready).length}

function load(){
  if(window.__DATA){D=window.__DATA;return route()}
  fetch('data/episodes.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){D=j;route()})
  .catch(function(){app.innerHTML='<div class="empty">目錄讀取失敗，請重新整理。</div>'});
}
function route(){
  clearInterval(timer);
  document.querySelectorAll('.mask,.sheet').forEach(function(x){x.remove()});
  var m=location.hash.match(/^#\/ep\/(\d+)/);
  if(m){var n=+m[1];if(n>=1&&n<=D.episodes.length)return reader(n)}
  home();
}
window.addEventListener('hashchange',function(){if(D)route()});

/* ---------- 首頁 ---------- */
function home(){
  var last=store.get('last',0), fav=store.get('fav',false), w=D.work;
  var lr=last?ep(last):null;
  var btn=lr?'繼續閱讀　第 '+last+' 集':'從第一集開始讀';
  ui.range=Math.max(0,RANGES.findIndex(function(r){return (last||1)>=r[0]&&(last||1)<=r[1]}));
  app.innerHTML=
   '<div class="hero">'+IMG.hero.map(function(s,i){return'<img src="'+s+'" alt=""'+(i?'':' class="on"')+'>'}).join('')+
   '<div class="dots">'+IMG.hero.map(function(s,i){return'<i'+(i?'':' class="on"')+'></i>'}).join('')+'</div></div>'+
   '<div class="info"><img class="cover" src="'+IMG.cover+'" alt=""><div>'+
   '<h1>'+esc(w.title)+'</h1><div class="st">'+esc(w.subtitle)+'</div>'+
   '<div class="meta">共 '+D.episodes.length+' 集・十八場・已上架 '+readyCount()+' 集</div></div></div>'+
   '<div class="tags"><span>古典奇情</span><span>戲中戲</span><span>1998 羅門劇團</span><span>連載中</span></div>'+
   '<div class="acts"><button class="btn" id="go">'+btn+'</button><button class="btn ghost'+(fav?' on':'')+'" id="fav">'+(fav?'★ 已收藏':'☆ 收藏')+'</button></div>'+
   '<div class="tabs"><button data-t="intro">簡介</button><button data-t="eps">選集</button></div>'+
   '<div class="pane" id="pane"></div>';
  var imgs=app.querySelectorAll('.hero img'),dots=app.querySelectorAll('.dots i'),k=0;
  timer=setInterval(function(){imgs[k].classList.remove('on');dots[k].classList.remove('on');k=(k+1)%imgs.length;imgs[k].classList.add('on');dots[k].classList.add('on')},4500);
  document.getElementById('go').onclick=function(){location.hash='#/ep/'+(last||1)};
  document.getElementById('fav').onclick=function(){store.set('fav',!fav);home()};
  app.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){ui.tab=b.dataset.t;pane()}});
  pane();
}
function pane(){
  app.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===ui.tab)});
  var p=document.getElementById('pane');
  if(ui.tab==='intro'){
    p.innerHTML='<div class="intro"><p>'+esc(D.work.intro)+'</p>'+
     '<div class="poem">有些相遇，在舞台上重來；<br>有些離別，卻在現實裡發生。</div>'+
     '<div class="sec">原劇十八場</div><div class="scenes">'+D.scenes.map(function(s){
       var a=(s.scene-1)*6+1;return'<button data-ep="'+a+'"><b>第'+zh(s.scene)+'場〈'+esc(s.name)+'〉</b><small>第 '+a+'～'+(a+5)+' 集</small></button>'}).join('')+'</div></div>';
    p.querySelectorAll('[data-ep]').forEach(function(b){b.onclick=function(){ui.tab='eps';ui.mode='toc';var n=+b.dataset.ep;ui.range=RANGES.findIndex(function(r){return n>=r[0]&&n<=r[1]});pane();var el=document.getElementById('sc'+scene(ep(n).scene).scene);if(el)el.scrollIntoView({block:'start'})}});
  }else{
    p.innerHTML=epList(store.get('last',0));
    bindList(p,function(){pane()});
  }
}
function epList(cur){
  var r=RANGES[ui.range];
  var h='<div class="bar"><div class="ranges">'+RANGES.map(function(x,i){return'<button data-r="'+i+'"'+(i===ui.range?' class="on"':'')+'>'+x[0]+'-'+x[1]+'</button>'}).join('')+'</div>'+
   '<div class="mode"><button data-m="grid"'+(ui.mode==='grid'?' class="on"':'')+'>格子</button><button data-m="toc"'+(ui.mode==='toc'?' class="on"':'')+'>目錄</button></div></div>';
  var list=D.episodes.slice(r[0]-1,r[1]);
  if(ui.mode==='grid'){
    h+='<div class="grid">'+list.map(function(e){return'<button class="cell'+(ready(e)?'':' wip')+(e.ep===cur?' cur':'')+'" data-ep="'+e.ep+'" title="'+esc(e.title)+'">'+e.ep+'</button>'}).join('')+'</div>';
  }else{
    var g={};list.forEach(function(e){(g[e.scene]=g[e.scene]||[]).push(e)});
    h+='<div class="toc">'+Object.keys(g).map(function(s){return'<div class="sc" id="sc'+s+'"><div class="sch">第'+zh(+s)+'場〈'+esc(scene(+s).name)+'〉</div>'+
      g[s].map(function(e){return'<button data-ep="'+e.ep+'"'+(e.ep===cur?' class="cur"':'')+'><span>第'+e.ep+'集</span><b>'+esc(e.title)+'</b>'+(ready(e)?'':'<em>撰寫中</em>')+'</button>'}).join('')+'</div>'}).join('')+'</div>';
  }
  h+='<div class="legend"><span><i style="background:var(--text)"></i>已上架</span><span><i style="background:var(--dim)"></i>撰寫中</span><span><i style="background:var(--gold)"></i>上次讀到</span></div>';
  return h;
}
function bindList(p,redraw,onPick){
  p.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){ui.range=+b.dataset.r;redraw()}});
  p.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){ui.mode=b.dataset.m;store.set('mode',ui.mode);redraw()}});
  p.querySelectorAll('[data-ep]').forEach(function(b){b.onclick=function(){if(onPick)onPick();location.hash='#/ep/'+b.dataset.ep}});
}

/* ---------- 閱讀頁 ---------- */
var FS=[17,19,21,24], THEMES=[['dark','夜'],['paper','紙'],['white','白']];
function reader(n){
  var e=ep(n), s=scene(e.scene), set=store.get('reader',{fs:1,theme:'dark'});
  store.set('last',n);
  app.innerHTML='<div class="reader '+set.theme+'" style="--fs:'+FS[set.fs]+'px">'+
   '<div class="rtop"><button class="ic" id="back" aria-label="回作品頁">‹</button><div class="t">第 '+n+' 集　'+esc(e.title)+'</div><button class="ic" id="aa" aria-label="閱讀設定" style="font-size:16px">Aa</button></div>'+
   '<div class="rhead"><div class="sc">第'+zh(s.scene)+'場〈'+esc(s.name)+'〉・第 '+n+' 集</div><h2>'+esc(e.title)+'</h2><div class="orn">◆ ◆ ◆</div></div>'+
   '<div id="body"></div>'+
   '<div class="rnav"><button id="prev"'+(n>1?'':' disabled')+'>‹ 上一集</button><button id="list">選集</button><button id="next"'+(n<D.episodes.length?'':' disabled')+'>下一集 ›</button></div></div>';
  window.scrollTo(0,0);
  document.getElementById('back').onclick=function(){location.hash='#/'};
  document.getElementById('prev').onclick=function(){location.hash='#/ep/'+(n-1)};
  document.getElementById('next').onclick=function(){location.hash='#/ep/'+(n+1)};
  document.getElementById('list').onclick=function(){listSheet(n)};
  document.getElementById('aa').onclick=function(){setSheet(n)};
  var body=document.getElementById('body');
  if(!ready(e)){body.innerHTML='<div class="empty"><div class="pen">✎</div>這一集還在撰寫中。<br>上架之後會直接出現在這裡。</div>';return}
  body.innerHTML='<div class="empty">載入中…</div>';
  var src=(window.__TEXT&&window.__TEXT[n]);
  (src!=null?Promise.resolve(src):fetch('data/chapters/'+e.file,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}))
  .then(function(t){body.className='body';body.innerHTML=md(t)})
  .catch(function(){body.innerHTML='<div class="empty">正文讀取失敗，請重新整理。</div>'});
}
/* 正文格式：空一行分段；單獨一行 --- 是場景轉換；![說明](圖片路徑) 是插圖 */
function md(t){
  return t.replace(/\r/g,'').split(/\n\s*\n/).map(function(b){
    b=b.trim(); if(!b)return'';
    if(/^-{3,}$/.test(b))return'<div class="brk">◇　◇　◇</div>';
    var im=b.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(im)return'<img src="data/chapters/'+esc(im[2])+'" alt="'+esc(im[1])+'" loading="lazy">';
    return'<p>'+esc(b).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function sheet(html,bind){
  var m=document.createElement('div');m.className='mask';
  var s=document.createElement('div');s.className='sheet';s.innerHTML='<div class="grab"></div>'+html;
  function close(){m.remove();s.remove()}
  m.onclick=close;document.body.appendChild(m);document.body.appendChild(s);bind(s,close);
}
function listSheet(n){
  ui.range=RANGES.findIndex(function(r){return n>=r[0]&&n<=r[1]});
  sheet('<h3>'+esc(D.work.title)+'－'+esc(D.work.subtitle)+'</h3><div id="sl"></div>',function(s,close){
    var box=s.querySelector('#sl');
    function draw(){box.innerHTML=epList(n);bindList(box,draw,close)}
    draw();
  });
}
function setSheet(n){
  var set=store.get('reader',{fs:1,theme:'dark'});
  sheet('<h3>閱讀設定</h3>'+
   '<div class="opt">字級<div class="seg">'+FS.map(function(f,i){return'<button data-fs="'+i+'"'+(i===set.fs?' class="on"':'')+' style="font-size:'+(12+i*2)+'px">A</button>'}).join('')+'</div></div>'+
   '<div class="opt">底色<div class="seg">'+THEMES.map(function(t){return'<button data-th="'+t[0]+'"'+(t[0]===set.theme?' class="on"':'')+'>'+t[1]+'</button>'}).join('')+'</div></div>',
  function(s){
    var r=app.querySelector('.reader');
    function apply(){store.set('reader',set);r.className='reader '+set.theme;r.style.setProperty('--fs',FS[set.fs]+'px');
      s.querySelectorAll('[data-fs]').forEach(function(b){b.classList.toggle('on',+b.dataset.fs===set.fs)});
      s.querySelectorAll('[data-th]').forEach(function(b){b.classList.toggle('on',b.dataset.th===set.theme)})}
    s.querySelectorAll('[data-fs]').forEach(function(b){b.onclick=function(){set.fs=+b.dataset.fs;apply()}});
    s.querySelectorAll('[data-th]').forEach(function(b){b.onclick=function(){set.theme=b.dataset.th;apply()}});
  });
}
load();
})();
</script>
</body>
</html>
